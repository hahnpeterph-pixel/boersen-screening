name: Anstoss Wochenendkette

# Startet die Wochenendlaeufe nacheinander per workflow_dispatch, wenn
# GitHub die geplanten Laeufe stark verspaetet (26.09.2026: Markthistorie
# 4,5 h zu spaet, Rest nicht gestartet). Claude hat keinen Knopf-Zugang,
# kann aber eine Datei in .github/anstoss/ hochladen - das loest diesen
# Ablauf aus. Jeder Lauf wird abgewartet, bevor der naechste startet:
# die Laeufe teilen die Concurrency-Gruppe "repo-schreiben", in der nur
# EIN Lauf warten darf - gleichzeitig gestartet wuerden sie sich
# gegenseitig verdraengen.
# Welche Laeufe: Zeile "laeufe: a.yml b.yml" in der hochgeladenen Datei,
# sonst die ganze Kette. Uebersprungen wird nur, was nach dem Start DIESES
# Ablaufs schon angelaufen ist (z. B. der verspaetete geplante Lauf).

# 03.10.2026 (Peter: "kuenftig alles im Wochenend-Lauf integrieren, was laufen sollte und koennte"):
# Diese Kette IST jetzt der Wochenendlauf - eigener Zeitplan Sa 00:07 UTC, die Einzellaeufe haben
# keinen Samstag-Zeitplan mehr (verspaetete Einzelstarts erzeugten Mischstaende, z. B. Historie 05:38
# nach dem Screening). Reihenfolge: Markthistorie, Historie, Hochs, Phasen, Ruecksetzer,
# Tagesreaktion, Stimmung, das abschliessende Screening und ZULETZT Kerzen Woche und Monat (inkl. Tageskerzen) -
# der Kerzen-Lauf uebernimmt die vom Screening reparierten Tage aus docs/kursverlauf* (03.10.2026).

on:
  schedule:
    - cron: "7 0 * * 6"
  push:
    branches: [main]
    paths:
      - ".github/anstoss/**"
  workflow_dispatch:

concurrency:
  group: anstoss
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  kette:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Laeufe nacheinander starten
        run: |
          set -u
          seit=$(date -u -d '5 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          datei=""
          [ "$GITHUB_EVENT_NAME" = "push" ] && datei=$(git diff --name-only HEAD~1 HEAD -- .github/anstoss | tail -1)
          liste=$( [ -n "$datei" ] && grep -oP '^laeufe:\s*\K.*' "$datei" || true )
          [ -z "$liste" ] && liste="markthistorie.yml historie.yml hochs.yml phasen.yml ruecksetzer.yml tagesreaktion.yml stimmung.yml screening.yml kerzen.yml"
          echo "Laeufe: $liste"
          for wf in $liste; do
            schon=$(gh run list --workflow "$wf" --limit 5 --json createdAt,status,conclusion \
              --jq "[.[] | select(.createdAt > \"$seit\") | select(.status != \"completed\" or .conclusion == \"success\")] | length")
            if [ "$schon" != "0" ]; then
              echo "== $wf: lief schon oder laeuft (seit $seit) - uebersprungen"
              id=$(gh run list --workflow "$wf" --limit 1 --json databaseId --jq '.[0].databaseId')
              gh run watch "$id" --interval 30 > /dev/null 2>&1 || true
              continue
            fi
            echo "== $wf: starte"
            vorher=$(gh run list --workflow "$wf" --limit 1 --json databaseId --jq '.[0].databaseId // 0')
            gh workflow run "$wf" --ref main
            id=$vorher
            for i in $(seq 1 30); do
              sleep 10
              id=$(gh run list --workflow "$wf" --limit 1 --json databaseId --jq '.[0].databaseId // 0')
              [ "$id" != "$vorher" ] && break
            done
            if [ "$id" = "$vorher" ]; then echo "   $wf: kein neuer Lauf erschienen"; continue; fi
            gh run watch "$id" --interval 30 > /dev/null 2>&1 || true
            echo "   $wf: $(gh run view "$id" --json conclusion --jq .conclusion)"
          done

name: Historie

on:
  schedule:
    # Woechentlich statt taeglich, aus demselben Grund wie bei hochs.yml:
    # die Verteilungen stuetzen sich auf sieben Jahre Historie, ein
    # einzelner neuer Handelstag verschiebt Median oder p75 praktisch nie
    # sichtbar. Samstag 06:00 UTC, eine Stunde vor hochs.yml (07:00) - beide
    # teilen sich die Concurrency-Gruppe "repo-schreiben" und wuerden sich
    # sonst gegenseitig in die Warteschlange schicken, statt sauber
    # nacheinander zu laufen.
    - cron: "0 6 * * 6"
  workflow_dispatch:
    inputs:
      jahre:
        description: "Jahre Historie"
        required: false
        default: "7"
      pivots:
        description: "Ticker fuer die Wendepunkt-Ausgabe (z.B. CDNS). Leer lassen fuer den normalen Lauf."
        required: false
        default: ""
      pivot_tage:
        description: "Wie viele Kalendertage zurueck die Wendepunkt-Ausgabe reicht"
        required: false
        default: "120"

# Gemeinsame Gruppe mit allen anderen Workflows: zwei Laeufe, die
# gleichzeitig nach docs/ schreiben, kollidieren beim Push. Der Name muss
# mit screening.yml und phasen.yml uebereinstimmen, sonst greift die Sperre
# nicht - bis 24.08.2026 stand hier boersen-screening-push.
concurrency:
  group: repo-schreiben
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  historie:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt

      # Diagnose: gibt alle erkannten Wendepunkte eines Wertes im Log aus -
      # Datum, Kurs, Hoch der Tiefkerze, Bestaetigungstag und ob das Tief in
      # die Serie zaehlt. Schreibt nichts und laeuft nur bei manuellem Start
      # mit eingegebenem Ticker - beim woechentlichen Zeitplan gibt es keine
      # Eingaben, event_name schuetzt davor, dass die leere Eingabe dort
      # falsch ausgewertet wird.
      - name: Wendepunkte pruefen
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.pivots != ''
        run: python historie.py --jahre ${{ github.event.inputs.jahre || '7' }} --pivots ${{ github.event.inputs.pivots }} --tage ${{ github.event.inputs.pivot_tage || '120' }}

      - name: Historie ausfuehren
        if: github.event_name == 'schedule' || github.event.inputs.pivots == ''
        run: python historie.py --jahre ${{ github.event.inputs.jahre || '7' }}

      # Leitet die wertspezifischen Kauf-RSI-Schwellen aus der eben
      # geschriebenen docs/puffer_je_tief.csv.gz ab (Entscheidung 79).
      # Muss nach historie.py laufen, weil es dessen Ausgabe liest. Beim
      # Wendepunkt-Lauf schreibt historie.py keine Rohdatei, deshalb
      # dieselbe Bedingung wie beim Schritt darueber.
      # Laeuft immer, unabhaengig vom Wendepunkt-Modus (04.09.2026
      # korrigiert). Vorher an dieselbe Bedingung wie "Historie ausfuehren"
      # gekoppelt - wer beim manuellen Start "pivots" ausfuellt, hat das
      # nicht mehr vor Augen und weiss spaeter nicht, warum die Schwellen
      # alt geblieben sind. Der Schritt liest nur die vorhandene
      # docs/puffer_je_tief.csv.gz; lief gerade der Wendepunkt-Modus und
      # die Datei ist unveraendert, entsteht dieselbe Datei erneut - das
      # kostet ein paar Sekunden, aber nichts wird falsch oder inkonsistent.
      - name: RSI-Schwellen ableiten
        run: python rsi_schwellen.py

      - name: Ergebnis speichern
        run: |
          git config user.name "screening-bot"
          git config user.email "actions@github.com"
          git add docs state
          if git diff --staged --quiet; then
            echo "Nichts geaendert."
            exit 0
          fi
          git commit -m "Historie $(date -u +%Y-%m-%d)"
          # Der Push scheitert, sobald main sich seit dem Checkout bewegt hat.
          # Deshalb vor jedem Versuch neu aufsetzen und bis zu drei Anlaeufe
          # nehmen, statt den ganzen Lauf zu verwerfen.
          for versuch in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin main; then
              echo "Gespeichert im Versuch $versuch."
              exit 0
            fi
            echo "Versuch $versuch fehlgeschlagen, neuer Anlauf in 10 Sekunden ..."
            sleep 10
          done
          echo "Push nach drei Versuchen fehlgeschlagen."
          exit 1

name: Historie

on:
  workflow_dispatch:
    inputs:
      jahre:
        description: "Jahre Historie"
        required: false
        default: "3"

# Gemeinsame Gruppe mit allen anderen Workflows: zwei Laeufe, die
# gleichzeitig nach docs/ schreiben, kollidieren beim Push.
concurrency:
  group: boersen-screening-push
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  historie:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt

      - name: Historie ausfuehren
        run: python historie.py --jahre ${{ github.event.inputs.jahre || '3' }}

      - name: Ergebnis speichern
        run: |
          git config user.name "screening-bot"
          git config user.email "actions@github.com"
          git add docs state
          if git diff --staged --quiet; then
            echo "Nichts geaendert."
            exit 0
          fi
          git commit -m "Historie $(date -u +%Y-%m-%d)"
          for versuch in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin main; then
              echo "Gespeichert im Versuch $versuch."
              exit 0
            fi
            echo "Versuch $versuch fehlgeschlagen, neuer Anlauf in 10 Sekunden ..."
            sleep 10
          done
          echo "Push nach drei Versuchen fehlgeschlagen."
          exit 1

name: Kerzen Woche und Monat

# Rohkerzen fuer die Kaufvorlage ohne Charts (Peter 28.09.2026).
# Wochen- und Monatskerzen so lang wie verfuegbar (kerzen.py --lang),
# dazu die Stundenkerzen der letzten Handelstage (kerzen.py --stunde).
# Die Stundenkerzen schreibt werktags der Screening-Workflow fort.
#
# Laeuft: Sa 04:20 UTC (zwischen Ruecksetzer 03:30 und Tagesreaktion 04:45,
# vor dem abschliessenden Screening 05:30), bei Aenderung an kerzen.py und von Hand.

on:
  # schedule: (siehe Anstoss Wochenendkette)
    # Samstag-Zeitplan entfernt 03.10.2026 (Peter): laeuft jetzt nur in der Kette "Anstoss Wochenendkette" (Sa 00:07 UTC)
  push:
    branches: [main]
    paths:
      - "kerzen.py"
      - ".github/workflows/kerzen.yml"
  workflow_dispatch:

concurrency:
  group: repo-schreiben
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  kerzen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt

      - name: Wochen- und Monatskerzen
        run: python kerzen.py --lang
        continue-on-error: true

      - name: Stundenkerzen
        run: python kerzen.py --stunde
        continue-on-error: true

      - name: Datenpruefung
        run: python datenpruefung.py
        continue-on-error: true

      - name: Ergebnis speichern
        run: |
          git config user.name "screening-bot"
          git config user.email "actions@github.com"
          git add docs/kerzen docs/datenpruefung.md docs/datenpruefung.csv
          if git diff --staged --quiet; then
            echo "Nichts geaendert."
            exit 0
          fi
          git commit -m "Kerzen $(date -u +%Y-%m-%d\ %H:%M)"
          for versuch in 1 2 3; do
            if git pull --rebase -X theirs --autostash origin main && git push origin main; then
              echo "Gespeichert im Versuch $versuch."
              exit 0
            fi
            echo "Versuch $versuch fehlgeschlagen, neuer Anlauf in 10 Sekunden ..."
            sleep 10
          done
          echo "Push nach drei Versuchen fehlgeschlagen."
          exit 1

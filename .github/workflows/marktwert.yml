name: Marktwert

# 04.10.2026 (Peter: Boersenwert / Branchenfuehrer pruefen): einmaliger Abruf der Boersenwerte nach docs/marktwert.csv.
# Beruehrt das Screening nicht. Startet bei Aenderung an marktwert.py oder per Hand.

on:
  push:
    branches: [main]
    paths:
      - "marktwert.py"
  workflow_dispatch:

concurrency:
  group: repo-schreiben
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  abruf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas
      - run: python marktwert.py
      - name: Ergebnis sichern
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs/marktwert.csv
          git commit -m "Marktwert $(date -u +%Y-%m-%d)" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done

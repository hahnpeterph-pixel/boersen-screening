name: Puffer-Analyse

# Einmalige Auswertung, NICHT im Tageslauf: ein Batch-Abruf ueber das ganze
# Universum plus mehrere Jahre Historie. Die Rechnung selbst dauert unter einer
# Sekunde, der Datenabruf ein bis zwei Minuten.
#
# Starten: Actions -> Puffer-Analyse -> "Run workflow".
# Ergebnis landet in docs/puffer.md.

on:
  workflow_dispatch:
    inputs:
      jahre:
        description: "Jahre Kurshistorie (Standard 3)"
        required: false
        default: "3"

# Alle drei Workflows schreiben ins selbe Repo. Laufen zwei gleichzeitig,
# verliert einer beim Push. Die gemeinsame Gruppe stellt sie hintereinander.
concurrency:
  group: repo-schreiben
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  puffer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt

      - name: Puffer-Analyse ausfuehren
        run: python puffer.py --jahre "${{ github.event.inputs.jahre || '3' }}"

      - name: Ergebnis speichern
        run: |
          git config user.name "screening-bot"
          git config user.email "actions@github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "Nichts geaendert."
            exit 0
          fi
          git commit -m "Puffer-Analyse $(date -u +%Y-%m-%d\ %H:%M)"
          # Der Push scheitert, sobald main sich seit dem Checkout bewegt hat -
          # etwa weil parallel ein anderer Workflow lief oder von Hand
          # committet wurde. Deshalb vor jedem Versuch neu aufsetzen und bis
          # zu drei Anlaeufe nehmen, statt den ganzen Lauf zu verwerfen.
          for versuch in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin main; then
              echo "Gespeichert im Versuch $versuch."
              exit 0
            fi
            echo "Versuch $versuch fehlgeschlagen, neuer Anlauf in 10 Sekunden ..."
            sleep 10
          done
          echo "Push nach drei Versuchen fehlgeschlagen."
          exit 1

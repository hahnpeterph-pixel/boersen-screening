name: Rueckblick

# Wendet die heutigen Kaufkriterien auf die abgeschlossenen Trades an.

# Braucht drei Jahre Historie fuer die Basiswerte der Trades.

#
# Starten: Actions -> Rueckblick -> "Run workflow".
# Ergebnis: docs/rueckblick.md.

on:
  workflow_dispatch:

concurrency:
  group: repo-schreiben
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  phasen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt

      - name: Rueckblick ausfuehren
        run: python rueckblick.py

      - name: Ergebnis speichern
        run: |
          git config user.name "screening-bot"
          git config user.email "actions@github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "Nichts geaendert."
            exit 0
          fi
          git commit -m "Rueckblick $(date -u +%Y-%m-%d\ %H:%M)"
          for versuch in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin main; then
              echo "Gespeichert im Versuch $versuch."
              exit 0
            fi
            echo "Versuch $versuch fehlgeschlagen, neuer Anlauf in 10 Sekunden ..."
            sleep 10
          done
          exit 1

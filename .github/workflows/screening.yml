name: Boersen-Screening

on:
  schedule:
    # ZWEI LAEUFE seit 26.08.2026.
    #
    # 19:00 UTC = 21:00 MESZ / 20:00 MEZ - fuer die europaeischen Boersen.
    # Bis 01.09.2026 stand hier 18:00 UTC. Auch der neue Nachlauf am
    # naechsten Morgen (05:00 UTC) kam fuer XETRA zu spaet - die
    # eigentliche Bremse ist offenbar nicht der Boersenschluss (15:30/16:30
    # UTC), sondern wie lange Yahoo braucht, um die Tageskerze zu
    # verarbeiten. Eine Stunde mehr Vorlauf als Versuch, bevor mehr
    # Nachlauf-Termine dazukommen.
    - cron: "0 19 * * 1-5"
    #
    # 22:15 UTC = 00:15 MESZ / 23:15 MEZ - fuer die US-Boersen.
    # Der US-Schluss liegt bei 20:00 UTC im Sommer und 21:00 UTC im Winter,
    # also nie spaeter als 21:00 UTC. Damit bleiben mindestens 75 Minuten
    # fuer Yahoo. Krumme Minute, weil GitHub Actions zur vollen Stunde
    # ueberlastet ist und geplante Laeufe dann 5-15 Minuten spaeter startet -
    # am 24.08.2026 waren es sogar zwei Stunden.
    #
    # Warum nicht ein Lauf fuer beides: bis 22:15 UTC kann Yahoo bei den
    # europaeischen Werten schon auf den Vortag zurueckgefallen sein. Am
    # 25.08.2026 standen um 02:17 UTC alle 39 DAX-Werte und ASML auf dem
    # Freitagsschluss. Der 19:00-Lauf holt sie, solange sie noch da sind.
    #
    # Damit der spaetere Lauf die guten Daten nicht ueberschreibt, greift
    # die Schutzregel in stand.py: ein aelterer Abruf ersetzt keinen
    # juengeren gespeicherten Stand. Bei gleichem Datum gewinnt der frische
    # Abruf, damit die US-Werte um 22:15 ihre vollstaendige Kerze bekommen.
    - cron: "15 22 * * 1-5"
    #
    # 05:00 UTC = 07:00 MESZ / 06:00 MEZ, Di-Sa - NACHTRAG fuer den
    # jeweiligen Vortag (Di holt Mo nach, Mi holt Di nach, usw.). Ergaenzt
    # am 01.09.2026: am 31.08.2026 hingen alle 40 DAX-Werte plus ASML noch
    # auf dem Freitagsschluss - Yahoo hatte den Montagsschluss offenbar bei
    # KEINEM der beiden Laeufe fertig, weder 18:00 (jetzt 19:00) noch 22:15
    # UTC. Kein Fehler in stand.py, das haelt korrekt zurueck statt
    # Schlechteres zu speichern - Yahoo hatte die Daten schlicht noch nicht.
    # Auch dieser Nachlauf reichte am 01.09.2026 nicht - bleibt trotzdem
    # bestehen, kostet nichts, wenn Yahoo immer noch nicht so weit ist.
    - cron: "0 5 * * 2-6"
  workflow_dispatch:        # erlaubt manuelles Starten per Knopfdruck

# Alle drei Workflows schreiben ins selbe Repo. Laufen zwei gleichzeitig,
# verliert einer beim Push. Die gemeinsame Gruppe stellt sie hintereinander.
concurrency:
  group: repo-schreiben
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  screening:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt

      - name: Screening ausfuehren
        run: python screener.py

      - name: Tiefs mit Volumen ausfuehren
        run: python tiefs.py

      - name: Marktdaten ausfuehren
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python marktdaten.py

      # Nach marktdaten.py, weil die Stundenwache dieselben Tageskerzen aus
      # dem Cache mitbenutzt - laeuft sie zuerst, holt sie alles doppelt.
      # continue-on-error, weil die Stundenreihe bei Yahoo unzuverlaessiger
      # ist als die Tagesreihe: ein Ausfall hier darf den Screening-Lauf
      # nicht mitreissen, die Kernberichte stehen zu diesem Zeitpunkt schon.
      - name: Stundenwache ausfuehren
        run: python stundenwache.py
        continue-on-error: true

      # Schlusskurse je Wert und Handelstag fuer das Blatt Rueckblick.
      # Laeuft im selben Workflow, damit nichts von Hand gestartet werden
      # muss - die Kerzen liegen zu diesem Zeitpunkt ohnehin im Cache von
      # kurse.py, der Abruf kostet also fast nichts extra.
      # continue-on-error wie bei der Stundenwache: eine Auswertung, die
      # erst nach Wochen gebraucht wird, darf den Tagesbericht nicht
      # gefaehrden.
      - name: Kursverlauf ausfuehren
        run: python kursverlauf.py
        continue-on-error: true

      # Kursluecken je Wert und ihr Schliessverhalten, fuer die Bewertung
      # offener Gaps in der Kaufvorlage. Nach kursverlauf.py, weil zu diesem
      # Zeitpunkt alle Tageskerzen im Cache von kurse.py liegen - der Abruf
      # kostet dann nichts extra. Aus demselben Grund fragt luecken.py
      # ausdruecklich 400d ab wie die uebrigen Skripte: ein abweichender
      # Zeitraum wuerde am Cache vorbeilaufen und alles doppelt holen.
      # continue-on-error wie bei den anderen Zusatzauswertungen.
      - name: Luecken ausfuehren
        run: python luecken.py
        continue-on-error: true

      # Komplette Block-1-Auswertung (Fortsetzungskette, Luecken-Fenster,
      # RSI-Schwelle, alle 9 Pufferstufen) fertig fuer die Kaufvorlage.
      # Nach marktdaten.py/rsi_schwellen-Aequivalent, luecken.py und
      # phasen.csv, weil heute.py alle drei als Rohdaten braucht. Faellt
      # dieser Schritt aus (z.B. weil eine der Eingabedateien fehlt), darf
      # das die vorherigen, bereits gesicherten Ergebnisse nicht mitreissen
      # - deshalb continue-on-error wie bei den anderen Zusatzauswertungen.
      - name: Heute-Auswertung ausfuehren
        run: python heute.py
        continue-on-error: true

      - name: Ergebnis speichern
        run: |
          git config user.name "screening-bot"
          git config user.email "actions@github.com"
          git add docs state
          if git diff --staged --quiet; then
            echo "Nichts geaendert."
            exit 0
          fi
          git commit -m "Screening $(date -u +%Y-%m-%d)"
          # Der Push scheitert, sobald main sich seit dem Checkout bewegt hat -
          # etwa weil parallel ein anderer Workflow lief oder von Hand
          # committet wurde. Deshalb vor jedem Versuch neu aufsetzen und bis
          # zu drei Anlaeufe nehmen, statt den ganzen Lauf zu verwerfen.
          for versuch in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin main; then
              echo "Gespeichert im Versuch $versuch."
              exit 0
            fi
            echo "Versuch $versuch fehlgeschlagen, neuer Anlauf in 10 Sekunden ..."
            sleep 10
          done
          echo "Push nach drei Versuchen fehlgeschlagen."
          exit 1
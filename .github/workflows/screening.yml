name: Boersen-Screening

on:
  schedule:
    # 22:15 UTC an Werktagen = 00:15 MESZ / 23:15 MEZ. Der Lauf faellt
    # damit auf den ABEND DES HANDELSTAGES, nicht auf den Morgen danach.
    #
    # Bis 25.08.2026 stand hier 02:17 UTC. Das hat sich als falsch
    # erwiesen: Yahoo ersetzt ueber Nacht die vorlaeufige Tageskerze der
    # europaeischen Boersen durch die offizielle Abrechnung, und solange
    # die fehlt, faellt der ganze Tag weg. Am 25.08.2026 standen deshalb
    # alle 39 DAX-Werte und ASML auf dem Schlusskurs vom Freitag, obwohl
    # der Lauf vom Vorabend um 21:08 UTC den Montag noch hatte. Ein
    # spaeterer Morgenlauf hilft nicht - um 06:10 UTC fehlte die Kerze
    # genauso. Nur der Abend des Handelstages liefert alle Werte.
    #
    # 22:15 UTC traegt in beiden Zeitzonen: der US-Schluss liegt bei
    # 20:00 UTC in der Sommerzeit und 21:00 UTC in der Winterzeit, also
    # nie spaeter als 21:00 UTC. Damit bleiben mindestens 75 Minuten fuer
    # Yahoo. Krumme Minute, weil GitHub Actions zur vollen Stunde
    # ueberlastet ist und geplante Laeufe dann 5-15 Minuten spaeter
    # startet - am 24.08.2026 waren es sogar zwei Stunden.
    - cron: "15 22 * * 1-5"
  workflow_dispatch:        # erlaubt manuelles Starten per Knopfdruck

# Alle drei Workflows schreiben ins selbe Repo. Laufen zwei gleichzeitig,
# verliert einer beim Push. Die gemeinsame Gruppe stellt sie hintereinander.
concurrency:
  group: repo-schreiben
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  screening:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt

      - name: Screening ausfuehren
        run: python screener.py

      - name: Tiefs mit Volumen ausfuehren
        run: python tiefs.py

      - name: Marktdaten ausfuehren
        run: python marktdaten.py

      - name: Ergebnis speichern
        run: |
          git config user.name "screening-bot"
          git config user.email "actions@github.com"
          git add docs state
          if git diff --staged --quiet; then
            echo "Nichts geaendert."
            exit 0
          fi
          git commit -m "Screening $(date -u +%Y-%m-%d)"
          # Der Push scheitert, sobald main sich seit dem Checkout bewegt hat -
          # etwa weil parallel ein anderer Workflow lief oder von Hand
          # committet wurde. Deshalb vor jedem Versuch neu aufsetzen und bis
          # zu drei Anlaeufe nehmen, statt den ganzen Lauf zu verwerfen.
          for versuch in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin main; then
              echo "Gespeichert im Versuch $versuch."
              exit 0
            fi
            echo "Versuch $versuch fehlgeschlagen, neuer Anlauf in 10 Sekunden ..."
            sleep 10
          done
          echo "Push nach drei Versuchen fehlgeschlagen."
          exit 1

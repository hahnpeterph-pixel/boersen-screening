name: Boersen-Screening

on:
  schedule:
    # 02:17 UTC an Werktagen = 04:17 MESZ / 03:17 MEZ
    # Basis sind die Schlusskurse des Vortags (US-Schluss 22:00 MESZ,
    # Yahoo liefert sie rund eine Stunde spaeter).
    # Krumme Minute, weil GitHub Actions zur vollen Stunde ueberlastet
    # ist und geplante Laeufe dann 5-15 Minuten spaeter startet.
    - cron: "17 2 * * 1-5"
  workflow_dispatch:        # erlaubt manuelles Starten per Knopfdruck

permissions:
  contents: write

jobs:
  screening:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt

      - name: Screening ausfuehren
        run: python screener.py

      - name: Tiefs mit Volumen ausfuehren
        run: python tiefs.py

      - name: Marktdaten ausfuehren
        run: python marktdaten.py

      - name: Ergebnis speichern
        run: |
          git config user.name "screening-bot"
          git config user.email "actions@github.com"
          git add docs state
          git diff --staged --quiet || git commit -m "Screening $(date -u +%Y-%m-%d)"
          git push

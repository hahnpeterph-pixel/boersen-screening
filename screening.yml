name: Boersen-Screening

on:
  schedule:
    - cron: '30 6 * * 0-4'
  workflow_dispatch:

jobs:
  screening:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python 3.11 einrichten
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Requirements installieren
        run: pip install -r requirements.txt

      - name: Screening ausfuehren
        run: python screener.py

      - name: Tiefs mit Volumen ausfuehren
        run: python tiefs.py

      - name: Ergebnis speichern
        run: |
          git config user.name "screening-bot"
          git config user.email "screening@example.com"
          git add -A
          git commit -m "[auto] Screening $(date -u +'%Y-%m-%d %H:%M')"
          git push

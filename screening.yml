name: Boersen-Screening

on:
  schedule:
    # 04:00 UTC an Werktagen = 06:00 MESZ / 05:00 MEZ
    # Basis sind damit die Schlusskurse des Vortags (US-Schluss 22:00 MESZ).
    - cron: "0 4 * * 1-5"
  workflow_dispatch:        # erlaubt manuelles Starten per Knopfdruck

permissions:
  contents: write

jobs:
  screening:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt

      - name: Screening ausfuehren
        run: python screener.py

      - name: Ergebnis speichern
        run: |
          git config user.name "screening-bot"
          git config user.email "actions@github.com"
          git add docs state
          git diff --staged --quiet || git commit -m "Screening $(date -u +%Y-%m-%d)"
          git push
